name: Deploy
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --frozen-lockfile
      - name: Build
        run: npm run docs:build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist
      # deploy-pages looks up the artifact right after the upload; GitHub sometimes does not list it yet
      # ("No artifacts named github-pages"). Wait until the run's artifact list contains it.
      - name: Wait for artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$n" -gt 0 ]; then echo "Artifact listed after $i attempt(s)"; exit 0; fi
            sleep 2
          done
          echo "::warning::Artifact github-pages not listed after 60 s, deploying anyway"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
